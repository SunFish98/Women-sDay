<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>历史女性导师匹配器 · 妇女节特别版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --purple-deep: #3D1466;
      --purple-mid: #6B2FA0;
      --purple-light: #9B59D4;
      --rose-gold: #C9956C;
      --rose-light: #F2C4CE;
      --rose-pale: #FDE8EE;
      --cream: #FDF8F5;
      --text-dark: #2D1B36;
      --text-mid: #5C3D6B;
      --text-light: #8B6A9A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-mid) 50%, #A0446A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ── INPUT SCREEN ── */
    #input-screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeIn 0.8s ease;
    }

    .hero-header {
      text-align: center;
      color: white;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 0.75rem;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }

    .petals {
      font-size: 1.4rem;
      letter-spacing: 4px;
      animation: float 3s ease-in-out infinite;
    }

    .input-card {
      width: 100%;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-label {
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .input-label span {
      color: var(--rose-light);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      color: white;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 14px 16px;
      resize: none;
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }

    textarea::placeholder { color: rgba(255,255,255,0.4); }
    textarea:focus {
      border-color: var(--rose-light);
      background: rgba(255,255,255,0.15);
    }

    .char-counter {
      text-align: right;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
    }
    .char-counter.warn { color: var(--rose-light); }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .chip:hover {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--rose-gold), #E8A87C);
      border: none;
      border-radius: 16px;
      color: white;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(201,149,108,0.4);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201,149,108,0.5);
    }

    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── LOADING SCREEN ── */
    #loading-screen {
      display: none;
      width: 100%;
      max-width: 420px;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.5s ease;
    }

    .loading-orb {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-light), var(--rose-gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      animation: pulse 2s ease-in-out infinite, spin-slow 8s linear infinite;
      box-shadow: 0 0 40px rgba(155,89,212,0.5);
    }

    .loading-texts {
      text-align: center;
      color: white;
    }

    .loading-text-item {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      opacity: 0;
      position: absolute;
      width: 100%;
      transition: opacity 0.5s;
    }

    .loading-text-item.active { opacity: 1; }

    .loading-texts-wrapper {
      position: relative;
      height: 2rem;
      width: 280px;
    }

    .loading-dots {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── RESULT SCREEN ── */
    #result-screen {
      display: none;
      width: 100%;
      max-width: 420px;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* THE SHARE CARD */
    #share-card {
      width: 360px;
      background: var(--cream);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(61, 20, 102, 0.4), 0 0 0 1px rgba(201,149,108,0.2);
      font-family: 'Noto Serif SC', Georgia, serif;
    }

    .card-top-band {
      height: 8px;
      background: linear-gradient(90deg, var(--purple-deep), var(--purple-mid), var(--rose-gold));
    }

    .card-body {
      padding: 24px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .card-date-badge {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      color: var(--text-light);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .avatar-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin-bottom: 12px;
      border: 3px solid var(--cream);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    .mentor-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      line-height: 1.3;
    }

    .mentor-era {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.75rem;
      color: var(--text-light);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 18px;
    }

    .card-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
      margin: 4px 0 16px;
    }

    .quote-block {
      width: 100%;
      background: linear-gradient(135deg, #FDF0F5, #F8F0FD);
      border-left: 3px solid var(--rose-gold);
      border-radius: 0 12px 12px 0;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .quote-mark {
      font-family: Georgia, serif;
      font-size: 2rem;
      color: var(--rose-gold);
      line-height: 0.5;
      display: block;
      margin-bottom: 6px;
    }

    .quote-text {
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text-dark);
      font-style: italic;
    }

    .quote-attr {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.72rem;
      color: var(--text-light);
      margin-top: 8px;
      text-align: right;
    }

    .advice-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--rose-gold);
      text-transform: uppercase;
      margin-bottom: 10px;
      align-self: flex-start;
    }

    .advice-text {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.88rem;
      line-height: 1.8;
      color: var(--text-dark);
      width: 100%;
    }

    .tags-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 4px;
      width: 100%;
    }

    .tag {
      background: linear-gradient(135deg, var(--purple-mid), var(--purple-light));
      color: white;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .card-footer {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-brand {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.4;
    }

    .footer-brand strong {
      display: block;
      font-size: 0.8rem;
      color: white;
    }

    .footer-flowers { font-size: 1.2rem; letter-spacing: 2px; }

    /* ACTION BUTTONS */
    .action-buttons {
      display: flex;
      gap: 12px;
      width: 360px;
    }

    .btn-secondary {
      flex: 1;
      padding: 14px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      color: white;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.2); }

    .btn-primary {
      flex: 1.5;
      padding: 14px;
      background: linear-gradient(135deg, var(--rose-gold), #E8A87C);
      border: none;
      border-radius: 14px;
      color: white;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(201,149,108,0.4);
    }

    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ERROR TOAST */
    #error-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #E74C3C;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.88rem;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
    }

    #error-toast.show { transform: translateX(-50%) translateY(0); }

    /* ANIMATIONS */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes spin-slow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>

  <!-- INPUT SCREEN -->
  <div id="input-screen">
    <div class="hero-header">
      <div class="hero-badge">🌸 国际妇女节 · 2026</div>
      <h1 class="hero-title">历史女性<br>导师匹配器</h1>
      <p class="hero-subtitle">说出你的困境，跨越时空<br>遇见最懂你的她</p>
    </div>

    <div class="input-card">
      <div class="input-label">你今天遇到了什么<span>职场/生活</span>上的烦恼？</div>

      <div>
        <textarea id="problem-input" maxlength="300" placeholder="说说你的困境，比如：&#10;「今天工作没有意义感」&#10;「被老板否定，很委屈」&#10;「想改变却不知道从哪开始」"></textarea>
        <div class="char-counter" id="char-counter">0 / 300</div>
      </div>

      <div class="example-chips" id="example-chips">
        <span class="chip">工作没意义感</span>
        <span class="chip">被老板 push</span>
        <span class="chip">想要突破自己</span>
        <span class="chip">自我怀疑</span>
        <span class="chip">身心俱疲</span>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
        🔮 找到我的历史导师
      </button>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="loading-orb">🌺</div>

    <div class="loading-texts">
      <div class="loading-texts-wrapper">
        <div class="loading-text-item active" id="lt-0">正在翻阅历史长卷…</div>
        <div class="loading-text-item" id="lt-1">寻找与你心意相通的她…</div>
        <div class="loading-text-item" id="lt-2">她正跨越时空向你走来…</div>
      </div>
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <!-- SHARE CARD -->
    <div id="share-card">
      <div class="card-top-band"></div>
      <div class="card-body">
        <div class="card-date-badge">🌸 国际妇女节 · 2026.03.08</div>
        <div class="avatar-ring" id="card-avatar" style="background: #7B3FA0;">🌺</div>
        <div class="mentor-name" id="card-name">导师姓名</div>
        <div class="mentor-era" id="card-era">朝代与年代</div>

        <div class="card-divider"></div>

        <div class="quote-block">
          <span class="quote-mark">"</span>
          <div class="quote-text" id="card-quote">名言内容</div>
          <div class="quote-attr" id="card-quote-attr">— 署名</div>
        </div>

        <div class="advice-label">✦ 她对你说</div>
        <div class="advice-text" id="card-advice">建议内容</div>

        <div class="tags-row" id="card-tags"></div>
      </div>
      <div class="card-footer">
        <div class="footer-brand">
          <strong>历史女性导师匹配器</strong>
          vibe coded with ♥ on Women's Day
        </div>
        <div class="footer-flowers">🌸🌷</div>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-buttons">
      <button class="btn-secondary" onclick="resetToInput()">🔄 换一个烦恼</button>
      <button class="btn-primary" id="save-btn" onclick="saveCard()">📱 保存图片</button>
    </div>
  </div>

  <!-- ERROR TOAST -->
  <div id="error-toast"></div>

  <script>
    const API_BASE = '';  // same origin

    // ── CHAR COUNTER ──
    const textarea = document.getElementById('problem-input');
    const counter = document.getElementById('char-counter');

    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      counter.textContent = `${len} / 300`;
      counter.className = 'char-counter' + (len > 250 ? ' warn' : '');
    });

    // ── EXAMPLE CHIPS ──
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        textarea.value = chip.textContent;
        textarea.dispatchEvent(new Event('input'));
        textarea.focus();
      });
    });

    // ── LOADING TEXT CYCLE ──
    let loadingInterval;
    function startLoadingCycle() {
      let idx = 0;
      const items = document.querySelectorAll('.loading-text-item');
      loadingInterval = setInterval(() => {
        items[idx].classList.remove('active');
        idx = (idx + 1) % items.length;
        items[idx].classList.add('active');
      }, 1800);
    }
    function stopLoadingCycle() {
      clearInterval(loadingInterval);
      document.querySelectorAll('.loading-text-item').forEach((el, i) => {
        el.classList.toggle('active', i === 0);
      });
    }

    // ── SCREEN TRANSITIONS ──
    function showScreen(id) {
      ['input-screen', 'loading-screen', 'result-screen'].forEach(s => {
        const el = document.getElementById(s);
        el.style.display = s === id ? 'flex' : 'none';
      });
    }

    function resetToInput() {
      showScreen('input-screen');
      stopLoadingCycle();
    }

    // ── POPULATE CARD ──
    function populateCard(data) {
      document.getElementById('card-avatar').textContent = data.avatar_emoji;
      document.getElementById('card-avatar').style.background = data.avatar_color || '#7B3FA0';
      document.getElementById('card-name').textContent = data.name;
      document.getElementById('card-era').textContent = data.era;
      document.getElementById('card-quote').textContent = data.quote;
      document.getElementById('card-quote-attr').textContent = data.quote_attribution;
      document.getElementById('card-advice').textContent = data.personal_advice;

      const tagsRow = document.getElementById('card-tags');
      tagsRow.innerHTML = '';
      (data.wisdom_tags || []).forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsRow.appendChild(span);
      });
    }

    // ── MAIN SUBMIT ──
    async function handleSubmit() {
      const problem = textarea.value.trim();
      if (problem.length < 5) {
        showError('请多说几个字，让我更好地理解你的困境 🌸');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      showScreen('loading-screen');
      startLoadingCycle();

      try {
        const resp = await fetch(`${API_BASE}/api/match`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ problem }),
        });

        const json = await resp.json();
        if (!resp.ok || !json.success) {
          throw new Error(json.error || '请求失败');
        }

        populateCard(json.data);
        stopLoadingCycle();
        showScreen('result-screen');
      } catch (err) {
        stopLoadingCycle();
        showScreen('input-screen');
        showError(err.message || '出现了一些问题，请稍后重试');
      } finally {
        btn.disabled = false;
      }
    }

    // ── SAVE CARD ──
    async function saveCard() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = '生成中…';

      try {
        const card = document.getElementById('share-card');
        const canvas = await html2canvas(card, {
          scale: 3,
          useCORS: true,
          backgroundColor: null,
          logging: false,
        });

        const link = document.createElement('a');
        link.download = `历史导师-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch {
        showError('保存失败，请截图保存');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '📱 保存图片';
      }
    }

    // ── ERROR TOAST ──
    let toastTimer;
    function showError(msg) {
      const toast = document.getElementById('error-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Enter key submits
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleSubmit();
    });
  </script>
</body>
</html>
